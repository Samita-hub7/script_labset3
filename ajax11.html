<!DOCTYPE html>
<html>
<head>
    <title>AJAX Example</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>BCA Description</h2>

    <button id="load">Display BCA Content</button>

    <p id="content">
        Click the button to display BCA content.
    </p>

    <script>
        $(document).ready(function() {

            $("#load").click(function() {

                $("#content").load("bca.txt");

            });

        });
    </script>

</body>
</html>
