<!DOCTYPE html>
<html>
<head>
    <title>BCA Content</title>
</head>
<body>
    <h2>BCA Description</h2>
    <button onclick="loadData()">Display Content</button>

    <p id="result"></p>

    <script>
        function loadData() {
            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("result").innerText =
                        this.responseText;
                }
            };

            xhttp.open("GET", "bca.txt", true);
            xhttp.send();
        }
    </script>
</body>
</html>
